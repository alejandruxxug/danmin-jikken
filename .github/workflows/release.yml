name: Release

# Builds the game natively on Linux, macOS and Windows when a tag like v1.0.0
# is pushed, zips each build and attaches the zips to the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  os_name: linux,   arch: amd64, goos: linux,   goarch: amd64, bin: danmin,     ldflags: "-s -w" }
          - { runner: macos-latest,   os_name: macos,   arch: arm64, goos: darwin,  goarch: arm64, bin: danmin,     ldflags: "-s -w" }
          - { runner: macos-latest,   os_name: macos,   arch: amd64, goos: darwin,  goarch: amd64, bin: danmin,     ldflags: "-s -w" }
          - { runner: windows-latest, os_name: windows, arch: amd64, goos: windows, goarch: amd64, bin: danmin.exe, ldflags: "-s -w -H=windowsgui" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: game/go.mod

      - name: Install Ebitengine dependencies (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: Test the model
        if: matrix.os_name == 'linux'
        run: go test -race ./...

      - name: Build
        shell: bash
        working-directory: game
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "${{ matrix.ldflags }}" -o "../stage/${{ matrix.bin }}" ./cmd/danmin

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) VERSION="dev" ;; esac
          NAME="danmin-jikken-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          cp README.md AI_USAGE.md LICENSE LICENSE-ART.md stage/
          cp game/assets/sound/README.txt stage/SOUND-CREDITS.txt
          cp ".github/release/HOW-TO-RUN-${{ matrix.os_name }}.txt" stage/HOW-TO-RUN.txt
          mkdir -p dist
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            (cd stage && 7z a -tzip "../dist/${NAME}.zip" .)
          else
            chmod +x stage/danmin
            (cd stage && zip -r -X "../dist/${NAME}.zip" .)
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          name: "断眠実験 DANMIN JIKKEN ${{ github.ref_name }}"
          files: dist/*.zip
          body: "Builds for Linux, macOS (Apple Silicon and Intel) and Windows."
